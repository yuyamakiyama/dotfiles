<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0d0c'/%3E%3Cpath d='M16 32h14M34 22h14M34 42h14' stroke='%23f2a93b' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* tokens: Instrument register. Light is the base; dark under prefers-color-scheme and data-theme="dark". */
      :root {
        color-scheme: light dark;
        --bg: #f4f5f3;
        --surface: #ffffff;
        --border: #dfe3e0;
        --border-bright: #888e8b;
        --text: #121614;
        --text-dim: #545e59;
        --accent: #955700;
        --accent-dim: rgba(149, 87, 0, 0.12);
        --ok: #1c7443;
        --warn: #7a5e00;
        --risk: #b0341e;
        --info: #1a6890;
        --node-top: var(--surface);
        --lift: rgb(18 22 20 / 0.12);
        --halo: 22%;
        --font-body: "Geist", "Segoe UI", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, monospace;
        --t-label: 0.75rem;
        --t-small: 0.875rem;
        --t-body: 1rem;
        --t-lead: 1.25rem;
        --t-h2: 1.625rem;
        --t-h1: clamp(1.625rem, 3vw, 2.125rem);
        --s-1: 0.25rem;
        --s-2: 0.5rem;
        --s-3: 0.75rem;
        --s-4: 1rem;
        --s-5: 1.5rem;
        --s-6: 2rem;
        --s-7: 3rem;
        --s-8: 4.5rem;
        --r-1: 4px;
        --r-2: 10px;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --fast: 150ms;
        --med: 300ms;
        --slow: 500ms;
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0b0d0c;
          --surface: #121614;
          --border: #1f2522;
          --border-bright: #5e6662;
          --text: #e6ebe8;
          --text-dim: #919d97;
          --accent: #f2a93b;
          --accent-dim: rgba(242, 169, 59, 0.14);
          --ok: #6fcf97;
          --warn: #e8c547;
          --risk: #ef6f5c;
          --info: #6cb6e0;
          --node-top: color-mix(in srgb, var(--text) 7%, var(--surface));
          --lift: rgb(0 0 0 / 0.45);
          --halo: 32%;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0b0d0c;
        --surface: #121614;
        --border: #1f2522;
        --border-bright: #5e6662;
        --text: #e6ebe8;
        --text-dim: #919d97;
        --accent: #f2a93b;
        --accent-dim: rgba(242, 169, 59, 0.14);
        --ok: #6fcf97;
        --warn: #e8c547;
        --risk: #ef6f5c;
        --info: #6cb6e0;
        --node-top: color-mix(in srgb, var(--text) 7%, var(--surface));
        --lift: rgb(0 0 0 / 0.45);
        --halo: 32%;
      }

      /* base */
      html {
        font-size: 17px;
        scroll-behavior: smooth;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: 400 var(--t-body)/1.6 var(--font-body);
        text-wrap: pretty;
        font-kerning: normal;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      ::selection {
        background: var(--accent-dim);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      a {
        color: var(--text);
        text-decoration: underline;
        text-decoration-color: var(--accent);
        text-underline-offset: 0.22em;
      }
      a:hover {
        color: var(--accent);
      }
      main {
        max-width: 64rem;
        margin: 0 auto;
        padding: var(--s-6) 16px var(--s-8);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--s-7);
      }
      @media (min-width: 52rem) {
        main {
          padding: var(--s-8) var(--s-5);
          gap: var(--s-8);
        }
      }
      section,
      figure {
        min-width: 0;
      }
      header {
        display: grid;
        gap: var(--s-4);
        min-width: 0;
      }
      h1,
      h2,
      .kpi .val {
        text-box: trim-both cap alphabetic;
      }
      h1 {
        font-size: var(--t-h1);
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-wrap: balance;
        margin-bottom: var(--s-2);
        overflow-wrap: anywhere;
      }
      h2 {
        font-size: var(--t-h2);
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.015em;
        text-wrap: balance;
      }
      .sec-head {
        display: grid;
        gap: var(--s-3) var(--s-5);
        align-items: baseline;
        border-top: 1px solid var(--border);
        padding-top: var(--s-5);
        margin-bottom: var(--s-6);
      }
      @media (min-width: 52rem) {
        .sec-head {
          grid-template-columns: 3fr 9fr;
        }
      }
      h3 {
        font-size: var(--t-body);
        line-height: 1.3;
        font-weight: 600;
      }
      .ve-label {
        font: 500 var(--t-label) var(--font-mono);
        color: var(--text-dim);
      }
      .caps {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 600;
        color: var(--text);
      }
      .meta {
        font: 500 var(--t-label) var(--font-mono);
        color: var(--text-dim);
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
        display: grid;
        gap: var(--s-1);
      }
      .meta .row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s-1) var(--s-3);
        min-width: 0;
      }
      .meta .k {
        min-width: 3.5rem;
      }
      .unit {
        font-size: 0.5em;
        font-weight: 500;
        color: var(--text-dim);
        letter-spacing: 0;
      }
      code {
        font: 0.875em var(--font-mono);
        font-variant-ligatures: none;
        overflow-wrap: anywhere;
      }

      /* figure */
      .frame {
        background:
          radial-gradient(
              circle at 1px 1px,
              color-mix(in srgb, var(--text) 13%, transparent) 1px,
              transparent 1.5px
            )
            0 0 / 20px 20px,
          var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--r-2);
        padding: var(--s-5);
        overflow-x: auto;
      }
      figcaption {
        font-size: var(--t-body);
        color: var(--text-dim);
        margin-top: var(--s-3);
        max-width: 65ch;
      }
      .fig-n {
        font: 600 var(--t-label) var(--font-mono);
        color: var(--text);
        margin-right: var(--s-2);
      }

      /* diagram kit */
      .ve-svg {
        width: 100%;
        min-width: 600px;
        height: auto;
        display: block;
        font: 500 17px var(--font-body);
      }
      .ve-e {
        fill: none;
        stroke: var(--text-dim);
        stroke-width: 1.75;
        marker-end: url(#ve-ah);
      }
      .ve-el {
        fill: var(--text-dim);
        font: 500 14px var(--font-mono);
        text-anchor: start;
        paint-order: stroke;
        stroke: var(--bg);
        stroke-width: 5px;
        stroke-linejoin: round;
      }
      .fn text {
        font: 500 14px var(--font-mono);
        dominant-baseline: central;
      }
      .fn .rowlab {
        fill: var(--text-dim);
      }
      .fn .sub {
        fill: var(--text-dim);
        text-anchor: middle;
        dominant-baseline: auto;
      }
      .fn .num {
        fill: var(--text);
        text-anchor: middle;
        font-weight: 600;
      }
      .fn .tot {
        fill: var(--text);
        font-weight: 600;
      }
      .fn .seg-src {
        fill: var(--surface);
        stroke: var(--border-bright);
        stroke-width: 1.5;
      }
      .fn .seg-mid {
        fill: var(--surface);
        stroke: var(--border-bright);
        stroke-width: 1.5;
      }
      .fn .seg-keep {
        fill: var(--accent);
        stroke: var(--accent);
        stroke-width: 1.5;
        filter: drop-shadow(
          0 0 12px color-mix(in srgb, var(--accent) var(--halo), transparent)
        );
      }
      .fn .num.on-keep {
        fill: var(--bg);
      }
      .fn .seg-rej {
        fill: url(#ve-hatch);
        stroke: var(--risk);
        stroke-width: 1.5;
      }
      .fn .seg-flt {
        fill: none;
        stroke: var(--border-bright);
        stroke-width: 1.5;
        stroke-dasharray: 6 5;
      }
      .fn .num.on-rej {
        paint-order: stroke;
        stroke: var(--bg);
        stroke-width: 4px;
        stroke-linejoin: round;
      }

      .flow .ve-n rect { fill: var(--node-top); stroke: var(--border-bright); stroke-width: 1.5; }
      .flow .ve-n text { fill: var(--text); font: 500 14px var(--font-mono); text-anchor: middle; dominant-baseline: central; }
      .flow .ve-n text.sub { fill: var(--text-dim); }
      .flow .ve-n text.verb { fill: var(--text-dim); font: 500 13px var(--font-body); }
      .flow .ve-n.dashed rect { stroke-dasharray: 6 5; }
      .flow .ve-n.bad rect { stroke: var(--risk); stroke-width: 2; }
      .flow .ve-n.fail rect { fill: url(#ve-hatch); stroke: var(--risk); stroke-width: 2.5; }
      .flow .ve-n.fail text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
      .flow .ve-e.hot { stroke: var(--accent); stroke-width: 2.5; }
      .flow .ve-e.dash { stroke-dasharray: 6 5; }
      .flow .ve-fail { fill: var(--risk); font: 600 14px var(--font-mono); }
      .frame:has(.flow) { overflow-x: hidden; }

      /* KPI strip */
      .kpis {
        display: flex;
        flex-wrap: wrap;
        gap: 1px;
        background: var(--border);
        border: 1px solid var(--border);
        border-radius: var(--r-2);
        overflow: hidden;
      }
      .kpi {
        flex: 1 1 14rem;
        background: var(--surface);
        padding: var(--s-5);
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: var(--s-3);
        min-width: 0;
      }
      .kpi .val {
        font: 600 2.75rem/1 var(--font-body);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
      }
      .ve-cells {
        align-self: end;
        width: 100%;
        max-width: 14rem;
        height: auto;
        font: 500 13px var(--font-mono);
        overflow: visible;
      }
      .ve-cells text {
        fill: var(--text-dim);
        dominant-baseline: central;
      }
      .cell-on {
        fill: var(--accent);
      }
      .cell-off {
        fill: none;
        stroke: var(--text-dim);
        stroke-width: 1.5;
      }
      .ve-bars {
        align-self: end;
        width: 100%;
        max-width: 16rem;
        height: auto;
        font: 500 13px var(--font-mono);
        overflow: visible;
      }
      .ve-bars text {
        fill: var(--text-dim);
        dominant-baseline: central;
      }
      .ve-bars rect {
        fill: var(--border-bright);
        transform-box: fill-box;
        transform-origin: left;
        transition: transform 900ms var(--ease) 150ms;
      }
      .ve-bars .hot {
        fill: var(--accent);
      }
      .ve-bars .hot + text {
        fill: var(--text);
      }
      .ve-bars .zero {
        stroke: var(--border-bright);
        stroke-width: 2;
      }
      .ve-bars .lab {
        fill: var(--text);
      }
      .kpi .note {
        font-size: var(--t-label);
        font-family: var(--font-mono);
        color: var(--text-dim);
      }

      /* small multiples */
      .cases {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(14.5rem, 1fr));
        gap: var(--s-4);
      }
      .case {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-2);
        padding: var(--s-4);
        display: grid;
        gap: var(--s-3);
        align-content: start;
        min-width: 0;
      }
      .case .ve-bars {
        max-width: none;
      }

      /* chips */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: var(--s-2);
        font: 600 var(--t-label) var(--font-mono);
        padding: 2px var(--s-2);
        border: 1px solid currentColor;
        border-radius: var(--r-1);
        white-space: nowrap;
        justify-self: start;
      }
      .chip::before {
        content: "";
        width: 0.5rem;
        height: 0.5rem;
        background: currentColor;
      }
      .chip.ok {
        color: var(--ok);
      }
      .chip.ok::before {
        border-radius: 50%;
      }
      .chip.warn {
        color: var(--warn);
      }
      .chip.warn::before {
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }
      .chip.risk {
        color: var(--risk);
      }
      .chip.info {
        color: var(--info);
      }
      .chip.info::before {
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      }

      /* callout */
      .callout {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-2);
        padding: var(--s-4);
        display: grid;
        gap: var(--s-3);
      }
      .callout p {
        max-width: 65ch;
        overflow-wrap: anywhere;
      }

      details {
        border-top: 1px solid var(--border);
        padding-top: var(--s-4);
        color: var(--text-dim);
        font-size: var(--t-body);
      }
      details + details {
        margin-top: var(--s-5);
      }
      summary {
        cursor: pointer;
        font: 500 var(--t-label) var(--font-mono);
        margin-bottom: var(--s-2);
        color: var(--text);
      }
      summary .n {
        color: var(--text-dim);
        margin-left: var(--s-2);
      }
      .items {
        display: grid;
        gap: var(--s-3);
        margin-top: var(--s-4);
      }
      .item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-2);
        padding: var(--s-4);
        display: grid;
        gap: var(--s-2);
        min-width: 0;
      }
      .item .claim {
        color: var(--text);
        font-weight: 600;
      }
      .item .why {
        color: var(--text-dim);
        max-width: 65ch;
      }
      .item .by {
        font: 500 var(--t-label) var(--font-mono);
        color: var(--text-dim);
      }
      .item .where {
        font: 500 var(--t-label) var(--font-mono);
        color: var(--text-dim);
        overflow-wrap: anywhere;
      }

      .js-motion main > * {
        transition:
          opacity var(--slow) var(--ease),
          transform var(--slow) var(--ease);
      }
      .js-motion main > :not(.in) {
        opacity: 0;
        transform: translateY(1rem);
      }
      .js-motion main > :not(.in) .ve-bars rect {
        transform: scaleX(0);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }

      @media print {
        :root {
          --bg: #fff;
          --surface: #fff;
          --border: #dfe3e0;
          --border-bright: #888e8b;
          --text: #121614;
          --text-dim: #545e59;
          --accent: #955700;
          --ok: #1c7443;
          --warn: #7a5e00;
          --risk: #b0341e;
          --info: #1a6890;
        }
        .frame {
          overflow: visible;
          background: #fff;
        }
        .ve-svg {
          min-width: 0;
        }
        .frame,
        .case,
        .kpi,
        .item,
        .finding {
          break-inside: avoid;
        }
        h2 {
          break-after: avoid;
        }
        svg * {
          filter: none !important;
        }
        .js-motion main > * {
          opacity: 1 !important;
          transform: none !important;
        }
        .js-motion .ve-bars rect {
          transform: none !important;
        }
        details > * {
          display: revert;
        }
      }
      /* additions for data-driven rendering */
      .flow .ve-n.trigger rect {
        stroke: var(--accent);
        stroke-width: 2;
      }
      .flow .ve-note {
        fill: var(--text-dim);
        font: 500 13px var(--font-mono);
        text-anchor: middle;
      }
      .flow .ve-note.bad {
        fill: var(--risk);
      }
      .flow .ve-n text.top {
        fill: var(--text);
      }
      .frame .custom-svg svg {
        max-width: none;
      }
      .frame .nodata {
        font: 500 var(--t-label) var(--font-mono);
        color: var(--text-dim);
      }
      /* findings */
      .finding-list {
        display: grid;
        gap: var(--s-8);
      }
      .finding {
        display: grid;
        gap: var(--s-4);
        min-width: 0;
        border-top: 1px solid var(--border);
        padding-top: var(--s-5);
      }
      .finding h3 {
        font-size: var(--t-lead);
        line-height: 1.3;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s-2) var(--s-3);
      }
      .tag {
        font: 500 var(--t-label) var(--font-mono);
        color: var(--text-dim);
        overflow-wrap: anywhere;
      }
      dl.details {
        display: grid;
        gap: var(--s-3);
        margin: 0;
      }
      .drow {
        display: grid;
        gap: var(--s-1) var(--s-4);
        grid-template-columns: minmax(0, 1fr);
        min-width: 0;
      }
      @media (min-width: 700px) {
        .drow {
          grid-template-columns: 9rem minmax(0, 1fr);
        }
      }
      dt {
        font: 500 var(--t-label) var(--font-mono);
        color: var(--text-dim);
        padding-top: 0.25rem;
      }
      dd {
        margin: 0;
        max-width: 70ch;
        overflow-wrap: anywhere;
      }
      fieldset.fixplan {
        border: 1px solid var(--border);
        border-radius: var(--r-2);
        background: var(--surface);
        padding: var(--s-4);
        min-width: 0;
      }
      fieldset.fixplan legend {
        font-weight: 600;
        padding: 0 var(--s-2);
      }
      .opts {
        display: grid;
        gap: var(--s-2);
      }
      .opt {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: var(--s-3);
        align-items: start;
        padding: var(--s-3);
        border: 1px solid var(--border);
        border-radius: var(--r-1);
        cursor: pointer;
      }
      .opt:hover {
        border-color: var(--border-bright);
      }
      .opt:has(input:checked) {
        border-color: var(--accent);
        background: var(--accent-dim);
      }
      .opt:has(input:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .opt input {
        accent-color: var(--accent);
        width: 1.1rem;
        height: 1.1rem;
        margin: 0.2rem 0 0;
      }
      .opt input:focus-visible {
        outline: none;
      }
      .opt-body {
        display: grid;
        gap: var(--s-1);
        min-width: 0;
      }
      .opt-label {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .opt-desc {
        color: var(--text-dim);
        font-size: var(--t-small);
        overflow-wrap: anywhere;
      }
      .fix-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--s-3);
        align-items: start;
      }
      @media (min-width: 700px) {
        .fix-grid {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
      }
      pre.preview,
      pre.prompt {
        font: 400 var(--t-small)/1.5 var(--font-mono);
        font-variant-ligatures: none;
        white-space: pre;
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--r-2);
        padding: var(--s-4);
      }
      pre.preview {
        min-height: 6rem;
      }
      pre.preview.is-empty {
        color: var(--text-dim);
        font-style: italic;
      }
      .prompt-panel {
        display: grid;
        gap: var(--s-3);
        margin-top: var(--s-7);
        padding-top: var(--s-5);
        border-top: 1px solid var(--border);
        min-width: 0;
      }
      .prompt-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--s-3);
      }
      .prompt-actions {
        display: flex;
        align-items: center;
        gap: var(--s-3);
      }
      pre.prompt {

    <script>

            catRows.reduce(function (a, r) { return Math.max(a, r.n); }, 0),

          var unit = Math.min(50, 140 / max);
          var desc = function (rows) { return rows.map(function (r) { return r.label + " " + r.n; }).join(", "); };

        }

        /* ---------- verification funnel ---------- */
        var SRC_NAMES = { builtinCodeReview: "built-in review", logicBugHunt: "logic-bug hunt" };
        function humanize(k) {
          return SRC_NAMES[k] || k.replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase();
        }

          var layout = function (entries) {
            return entries.reduce(function (acc, e) {
              var x = acc.length ? acc[acc.length - 1].x + acc[acc.length - 1].w : X;
              return acc.concat([{ label: e[0], n: e[1], x: x, w: w(e[1]), cls: e[2] }]);

            svg("text", { class: "tot", x: X + dw + 12, y: yD + 14 }, String(dedupe)),

          return section("pipeline", "Verification",
            cand + " candidates narrowed to " + plural(kept, "finding"),

        }

        /* ---------- flows ---------- */
        var VCH = 7.4;

            .concat(n.labelLines.map(function (t) { return [t, "top"]; }),

          });
          var maxLines = nodes.reduce(function (a, x) { return Math.max(a, x.lines.length); }, 1);
          var height = maxLines * 20 + 28;
          var padTop = 34;
          var placed = nodes.map(function (x, i) {
            return Object.assign({}, x, { x: 2 + i * (width + ARROW_GAP) });
          });
          var maxNote = placed.reduce(function (a, x) { return Math.max(a, x.noteLines.length); }, 0);
          var totalW = 4 + n * width + (n - 1) * ARROW_GAP;
          var totalH = padTop + height + (maxNote ? 22 + maxNote * 17 : 0) + 14;
          return { nodes: placed, height: height, padTop: padTop, totalW: totalW, totalH: totalH,
            nodeW: width, gapW: ARROW_GAP, maxLines: maxLines };
        }
        function nodeClass(kind) {
          return "ve-n" + (kind === "fail" ? " fail" : kind === "result" ? " bad" : kind === "trigger" ? " trigger" : "");
        }
        function flowSvg(steps, label, L) {
          var arrowY = L.padTop + L.height / 2;
          var drawn = L.nodes.map(function (n, i) {
            var kind = n.s.kind;
            var lines = textRows(n);
            var y0 = L.padTop + (L.height - lines.length * 20) / 2 + 10;
            var prev = i > 0 ? L.nodes[i - 1] : null;
            var hot = kind === "fail";
            return [
              prev
                ? [
                    svg("path", { class: "ve-e" + (hot ? " hot" : ""),
                      d: "M" + (prev.x + prev.width) + " " + arrowY + "H" + n.x })
                  ]
                : null,
              svg("g", { class: nodeClass(kind) },
                svg("rect", { x: n.x, y: L.padTop, width: n.width, height: L.height, rx: 4 }),
                lines.map(function (l, j) {
                  return svg("text", { class: l[1], x: n.x + n.width / 2, y: y0 + j * 20 }, l[0]);
                })),
              kind === "fail" ? svg("text", { class: "ve-fail", x: n.x, y: L.padTop - 10 }, "✕ fails here") : null,
              n.noteLines.map(function (nl, j) {
                return svg("text", { class: "ve-note" + (kind === "fail" || kind === "result" ? " bad" : ""),
                  x: n.x + n.width / 2, y: L.padTop + L.height + 22 + j * 17 }, nl);
              })
            ];
          });
          return svg("svg", { class: "ve-svg flow", style: "width:" + L.totalW + "px;max-width:none;min-width:0",
            viewBox: "0 0 " + L.totalW + " " + L.totalH, role: "img", "aria-label": label }, drawn);
        }

        function flowLayoutVertical(steps, avail) {
          var W = Math.floor(Math.min(Math.max(avail, 200), 420));
          var nodeW = W - 6;
          var chars = Math.max(10, Math.floor((nodeW - 32) / CH));
          var noteChars = Math.max(12, Math.floor((nodeW - 8) / 8.2));
          var nodes = steps.map(function (s, i) {
            var t = flowText(s, chars, i > 0);
            var lines = t.lines.length ? t.lines : ["…"];
            var noteLines = s.note ? wrap(s.note, noteChars) : [];
            var gap = i === 0 ? 0 : s.kind === "fail" ? 60 : 36;
            return { s: s, verbLines: t.verbLines, labelLines: t.labelLines, codeLines: t.codeLines, lines: lines,
              noteLines: noteLines, gap: gap,
              height: lines.length * 20 + 28,
              noteH: noteLines.length ? 8 + noteLines.length * 17 : 0 };
          });
          var placed = nodes.reduce(function (acc, n) {
            var prev = acc.length ? acc[acc.length - 1] : null;
            var y = prev ? prev.y + prev.height + prev.noteH + n.gap : 4;
            return acc.concat([Object.assign({}, n, { y: y })]);
          }, []);
          var last = placed.length ? placed[placed.length - 1] : null;
          var totalH = last ? last.y + last.height + last.noteH + 6 : 8;
          return { W: W, nodeW: nodeW, nodes: placed, totalH: totalH };
        }
        function flowSvgVertical(label, V) {
          var cx = V.W / 2;
          var drawn = V.nodes.map(function (n, i) {
            var kind = n.s.kind;
            var prev = i > 0 ? V.nodes[i - 1] : null;
            var hot = kind === "fail";
            var lines = textRows(n);
            var y0 = n.y + (n.height - lines.length * 20) / 2 + 10;
            var arrowTop = prev ? prev.y + prev.height + prev.noteH : 0;
            return [
              prev
                ? [
                    svg("path", { class: "ve-e" + (hot ? " hot" : ""),
                      d: "M" + cx + " " + arrowTop + "V" + n.y })
                  ]
                : null,
              svg("g", { class: nodeClass(kind) },
                svg("rect", { x: 3, y: n.y, width: V.nodeW, height: n.height, rx: 4 }),
                lines.map(function (l, j) {
                  return svg("text", { class: l[1], x: 3 + V.nodeW / 2, y: y0 + j * 20 }, l[0]);
                })),
              kind === "fail" ? svg("text", { class: "ve-fail", x: 3, y: n.y - 10 }, "✕ fails here") : null,
              n.noteLines.map(function (nl, j) {
                return svg("text", { class: "ve-note" + (kind === "fail" || kind === "result" ? " bad" : ""),
                  x: cx, y: n.y + n.height + 22 + j * 17 }, nl);
              })
            ];
          });
          return svg("svg", { class: "ve-svg flow", style: "width:" + V.W + "px;max-width:none;min-width:0",
            viewBox: "0 0 " + V.W + " " + V.totalH, role: "img", "aria-label": label }, drawn);
        }

        function frameAvail(frame) {
          var cs = typeof getComputedStyle === "function" ? getComputedStyle(frame) : null;
          var pad = cs ? (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0) : 0;
          return Math.max(0, frame.clientWidth - pad);
        }
        function chooseFlow(steps, avail, canObserve) {
          var H = canObserve ? flowLayout(steps, avail) : null;
          return H
            ? { mode: "h", key: "h" + H.nodeW + "-" + H.gapW, H: H, avail: avail }
            : { mode: "v", key: "v" + Math.floor(Math.min(Math.max(avail, 200), 420)), V: flowLayoutVertical(steps, avail), avail: avail };
        }
        var flowEntries = [];
        function drawFlow(entry) {
          var avail = frameAvail(entry.frame);
          if (avail <= 0) return;
          var plan = chooseFlow(entry.steps, avail, typeof ResizeObserver === "function");
          if (plan.key === entry.key) return;
          entry.key = plan.key;
          entry.frame.textContent = "";
          entry.frame.appendChild(plan.mode === "h"
            ? flowSvg(entry.steps, entry.label, plan.H)
            : flowSvgVertical(entry.label, plan.V));
        }
        function flowFigure(f) {
          var steps = arr(f.flow).filter(isObj);
          var custom = typeof f.svg === "string" && f.svg.trim() !== "";
          var body;
          if (custom) {
            body = el("div", { class: "custom-svg" });
            body.innerHTML = f.svg;
          } else if (steps.length) {
            var label = str(f.id) + ": " + steps.map(function (s, i) {
              return (i > 0 && s.verb ? "(" + s.verb + ") " : "") + (s.label || s.code || "step");
            }).join(" → ");
            flowEntries.push({ steps: steps, label: label, frame: null, key: null });
            body = flowSvgVertical(label, flowLayoutVertical(steps, 320));
          } else {
            body = el("p", { class: "nodata" }, "No flow provided");
          }
          var frame = el("div", { class: "frame" }, body);
          if (steps.length && !custom) flowEntries[flowEntries.length - 1].frame = frame;
          return figure(frame, "Flow for " + str(f.id) + ", trigger to wrong result.");
        }
        /* ---------- findings ---------- */
        function optionsOf(f) {
          var list = arr(f.fixOptions).filter(isObj).filter(function (o) { return str(o.id) !== ""; });
          var rec = list.filter(function (o) { return o.recommended === true; }).slice(0, 1);
          var rest = list.filter(function (o) { return rec.indexOf(o) < 0; });
          return rec.concat(rest).map(function (o) { return { o: o, rec: rec.indexOf(o) >= 0 }; });
        }
        var plans = findings.map(function (f) {
          var opts = optionsOf(f);
          return { f: f, opts: opts, chosen: opts.length ? str(opts[0].o.id) : null };
        });
        function chosenOption(p) {
          var hit = p.opts.filter(function (x) { return str(x.o.id) === p.chosen; });
          return hit.length ? hit[0].o : null;
        }
        function promptText() {
          var lines = plans.filter(function (p) { return p.opts.length; }).map(function (p) {
            var o = chosenOption(p);
            return "- " + str(p.f.id) + " · " + str(p.f.file) + ":" + str(p.f.line) + " · " + str(p.f.title) +
              " → " + str(o.label) + ": " + str(o.description);
          });
          return ['Apply this fix plan from the /pr-review review "' + title + '":'].concat(lines).join("\n");
        }
        var promptBox = null;
        function refreshPrompt() { if (promptBox) promptBox.textContent = promptText(); }

        function fixPlan(p, idx) {
          var f = p.f;
          if (!p.opts.length) {
            return el("div", { class: "fixplan-empty" }, el("p", { class: "nodata" }, "No fix options provided"));
          }
          var hasPreview = p.opts.some(function (x) { return str(x.o.preview) !== ""; });
          var box = hasPreview ? el("pre", { class: "preview", tabindex: "0", "aria-live": "polite" }) : null;
          var showPreview = function (o) {
            if (!box) return;
            var text = str(o.preview);
            box.classList.toggle("is-empty", text === "");
            box.textContent = text !== "" ? text : "No preview for this option";
          };
          var group = "fix-" + idx;
          var labels = p.opts.map(function (x) {
            var o = x.o, oid = str(o.id);
            var input = el("input", { type: "radio", name: group, value: oid, checked: oid === p.chosen });
            var pick = function () { p.chosen = oid; showPreview(o); refreshPrompt(); };
            input.addEventListener("change", pick);
            input.addEventListener("focus", function () { showPreview(o); });
            input.addEventListener("blur", function () { var c = chosenOption(p); if (c) showPreview(c); });
            return el("label", { class: "opt" }, input,
              el("span", { class: "opt-body" },
                el("b", { class: "opt-label" }, str(o.label) + (x.rec ? " (Recommended)" : "")),
                el("span", { class: "opt-desc" }, str(o.description))));
          });
          showPreview(chosenOption(p));
          var fs = el("fieldset", { class: "fixplan" },
            el("legend", {}, "How should " + str(f.id) + " be fixed?"),
            el("div", { class: "opts" }, labels));
          return hasPreview ? el("div", { class: "fix-grid" }, fs, box) : el("div", { class: "fix-single" }, fs);
        }

        function findingBlock(p, idx) {
          var f = p.f;
          var sev = str(f.severity), ver = str(f.verdict).toUpperCase();
          var by = arr(f.foundBy).map(str).join(", ");
          var rows = [
            ["Defect", str(f.defect)],
            ["Failure scenario", str(f.failureScenario)],
            ["Suggested fix", str(f.fix)],
            ["Context", str(f.context)],
            ["Found by", by]
          ].filter(function (r) { return r[1] !== ""; });
          return el("article", { class: "finding", "aria-labelledby": "finding-h-" + idx },
            el("h3", { id: "finding-h-" + idx }, str(f.id) + " · " + str(f.title)),
            el("div", { class: "chips" },
              chip(SEV_CHIP[sev] || "info", sev.charAt(0).toUpperCase() + sev.slice(1)),
              chip(ver === "CONFIRMED" ? "ok" : ver === "PLAUSIBLE" ? "warn" : "info", ver),
              str(f.category) ? el("span", { class: "tag" }, str(f.category)) : null,
              el("code", { class: "tag" }, str(f.file) + ":" + str(f.line))),
            flowFigure(f),
            el("dl", { class: "details" }, rows.map(function (r) {
              return el("div", { class: "drow" }, el("dt", {}, r[0]), el("dd", {}, r[1]));
            })),
            el("div", { class: "fixplan-wrap" }, fixPlan(p, idx)));
        }

        function copyPanel() {
          var status = el("span", { class: "ve-label", role: "status" });
          promptBox = el("pre", { class: "prompt", tabindex: "0", "aria-label": "Fix prompt" });
          refreshPrompt();
          var timer = null;
          var say = function (msg) {
            status.textContent = msg;
            if (timer !== null) clearTimeout(timer);
            timer = setTimeout(function () { status.textContent = ""; }, 2000);
          };
          var btn = el("button", { type: "button", class: "copy" }, "Copy");
          btn.addEventListener("click", async function () {
            try {
              await navigator.clipboard.writeText(promptText());
              say("Copied");
            } catch (err) {
              try {
                var range = document.createRange();
                range.selectNodeContents(promptBox);
                var sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
              } catch (e2) {}
              say("Press ⌘C");
            }
          });
          return el("div", { class: "prompt-panel" },
            el("div", { class: "prompt-head" }, el("h3", {}, "Fix prompt"), el("div", { class: "prompt-actions" }, status, btn)),
            promptBox);
        }

        function findingsSection() {
          var withOpts = plans.some(function (p) { return p.opts.length; });
          return section("findings", plural(findings.length, "finding"), "Findings",
            el("div", { class: "finding-list" }, plans.map(findingBlock)),
            withOpts ? copyPanel() : null);
        }
        function noFindings() {
          return section("findings", "No findings", "Findings",
            el("div", { class: "callout" }, chip("ok", "Clean"),
              el("p", {}, "No findings survived verification. Charts, flow diagrams and the fix plan are omitted.")));
        }

        /* ---------- excluded ---------- */
        function items(list, withBy) {
          return el("div", { class: "items" }, list.map(function (r) {
            var by = arr(r.foundBy).map(str).join(", ");
            return el("div", { class: "item" },
              el("span", { class: "where" }, str(r.file) + ":" + str(r.line)),
              el("p", { class: "claim" }, str(r.claim)),
              el("p", { class: "why" }, str(r.reason)),
              withBy && by ? el("span", { class: "by" }, "Found by: " + by) : null);
          }));
        }
        function rejectedSection() {
          return section("rejected", "Rejected", plural(rejected.length, "candidate") + " failed verification",
            el("details", {}, el("summary", {}, "Rejected by verification", el("span", { class: "n" }, String(rejected.length))),
              items(rejected, true)));
        }
        function filteredSection() {
          return section("filtered", "Filtered out", plural(filteredOut.length, "candidate") + " were not behavior bugs",
            el("details", {}, el("summary", {}, "Filtered out — not behavior bugs", el("span", { class: "n" }, String(filteredOut.length))),
              items(filteredOut, false)));
        }

        /* ---------- assemble ---------- */
        var parts = [pageHeader(), nextAction(), numbers()]
          .concat(hasFindings ? [charts()] : [])
          .concat([funnel(), hasFindings ? findingsSection() : noFindings(), rejectedSection(), filteredSection()]);
        var main = document.getElementById("cr-main");
        parts.forEach(function (node) { main.appendChild(node); });

        /* ---------- behavior ---------- */
        flowEntries.forEach(drawFlow);
        if (typeof ResizeObserver === "function") {
          var flowTimer = null;
          var ro = new ResizeObserver(function () {
            if (flowTimer !== null) clearTimeout(flowTimer);
            flowTimer = setTimeout(function () { flowEntries.forEach(drawFlow); }, 80);
          });
          flowEntries.forEach(function (e) { ro.observe(e.frame); });
        }
        var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!still && "IntersectionObserver" in window) {
          document.documentElement.classList.add("js-motion");
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
              if (!e.isIntersecting) return;
              io.unobserve(e.target);
              e.target.classList.add("in");
              e.target.querySelectorAll("[data-count]").forEach(function (node) {
                var end = +node.dataset.count, t0 = performance.now();
                var step = function (t) {
                  var k = Math.min(1, (t - t0) / 900);
                  node.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))).toLocaleString("en-US");
                  if (k < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
              });
            });
          }, { rootMargin: "0px 0px -10% 0px" });
          document.querySelectorAll("main > *").forEach(function (node) { io.observe(node); });
        }
      })();
    </script>
  </body>
</html>
